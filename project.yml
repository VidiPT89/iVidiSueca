name: iVidiSueca
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: S769436W24
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  iVidiSueca:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iVidiSueca
    info:
      path: iVidiSueca/Info.plist
      properties:
        CFBundleDisplayName: iVidiSueca
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, pt-PT]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: BrandBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        # Portrait-only layout: opt out of iPad multitasking, which would require every orientation.
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.iSueca
        PRODUCT_NAME: iVidiSueca
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
  iVidiSuecaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iVidiSuecaUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: iVidiSueca
schemes:
  iVidiSueca:
    build:
      targets:
        iVidiSueca: all
        iVidiSuecaUITests: [test]
    test:
      targets:
        - iVidiSuecaUITests
